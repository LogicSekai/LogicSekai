name = "logic-sekai"
pages_build_output_dir = ".output/public"
compatibility_date = "2024-11-09"
compatibility_flags = ["nodejs_compat"]

[build]
command = "NODE_ENV=production bun run build"

[[d1_databases]]
binding = "DB"
database_name = "logic-sekai-db"
database_id = "" # Isi dengan database ID dari Cloudflare dashboard
migrations_dir = "./app/lib/db/migrations"

[vars]
BETTER_AUTH_URL = "https://logic-sekai.pages.dev"
NODE_ENV = "production"

# Preview environment
[env.preview]
name = "logic-sekai-preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "logic-sekai-db-preview"
database_id = "" # Isi dengan preview database ID