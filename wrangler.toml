name = "logicsekai"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-09"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "logic-sekai-db"
database_id = "8e584977-b7e9-4f7d-aa4c-a30fab656636"
migrations_dir = "./app/lib/db/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "logicsekai-uploads"

[vars]
BETTER_AUTH_URL = "https://logicsekai.com"
NODE_ENV = "production"

# ── Opsional (Fase 4): Cloudflare Rate Limiting binding ──────────────────────
# Pertahanan rate-limit yang andal (bukan in-memory). Server middleware otomatis
# memakainya bila tersedia. REKOMENDASI utama tetap: Cloudflare Rate Limiting
# Rules via dashboard/WAF. Uncomment untuk mengaktifkan binding:
#
# [[unsafe.bindings]]
# name = "AUTH_RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 15, period = 60 }
#
# [[unsafe.bindings]]
# name = "API_RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1002"
# simple = { limit = 100, period = 60 }
