name: Test

on:
  pull_request:
  push:
    branches: [development, prod, main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.16"
      - name: Install dependencies
        run: bun install
      - name: Run unit tests
        run: bun run test
